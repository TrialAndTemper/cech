# Link check settings for `mise run docs:check` (ADR 4). lychee reads
# this file from the repository root and skips git-ignored files.

# Keep results for a day in .lycheecache, which git ignores, so a second
# run does not ask the same hosts again.
cache = true
max_cache_age = "1d"

# A link to a heading must name one that exists.
include_fragments = "anchor-only"

# Check hidden paths too, such as .github/, which holds the pull request
# template and the issue forms. lychee still skips git-ignored files. With
# hidden on, lychee would walk into .git/ as well, at any depth, so
# exclude_path keeps it out, with either separator, since the link check
# also runs on Windows.
hidden = true
exclude_path = ['(^|[/\\])\.git[/\\]']

# lychee 0.24.2's default file types, plus YAML for the issue forms and
# workflows. It reads YAML as plain text, so it finds full URLs only.
extensions = [
  "md", "mkd", "mdx", "mdown", "mdwn", "mkdn", "mkdown", "markdown",
  "html", "htm", "css", "txt", "xml", "yml", "yaml",
]

# Links to this machine cannot work for anyone else.
exclude_loopback = true

max_retries = 2
timeout = 20
