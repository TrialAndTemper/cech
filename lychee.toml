# Link check settings for `mise run docs:check` (ADR 10). lychee reads
# this file from the repository root and skips git-ignored files.

# Keep results for a day in .lycheecache, which git ignores, so a second
# run does not ask the same hosts again.
cache = true
max_cache_age = "1d"

# A link to a heading must name one that exists.
include_fragments = "anchor-only"

# Check hidden paths too, such as .github/, which holds the pull request
# template. lychee still skips git-ignored files, and does not read YAML,
# so the issue forms go unchecked. With hidden on, lychee would walk into
# .git/ as well, at any depth, so exclude_path keeps it out.
hidden = true
exclude_path = ['(^|/)\.git/']

# Links to this machine cannot work for anyone else.
exclude_loopback = true

max_retries = 2
timeout = 20
