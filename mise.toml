# mise is CECH's task runner (ADR 4): `mise run check` runs every gate,
# and `mise run <gate>` runs one. Run `mise trust` and `mise install`
# once per clone.
min_version = "2026.10.3"

[settings]
lockfile = true
# When mise resolves a version, as in `mise use` or `mise upgrade`, skip
# releases younger than a week. A version written here by hand is not
# checked, so review its release date.
minimum_release_age = "168h"

# Pinned exactly; mise.lock records each download and its checksum.
[tools]
actionlint = "1.7.12"
# bats has no Windows build. Its download is GitHub's archive of the
# release tag, for which `mise lock` records no checksum, so the
# checksum in mise.lock was added by hand: on a bump, put the new
# archive's sha256 there for each platform.
bats = { version = "1.14.0", os = ["linux", "macos"] }
gitleaks = "8.30.1"
go = "1.27.3"
# mise builds govulncheck from source with the pinned go, which checks
# the module against the Go checksum database; mise.lock records the
# version only, with no download or checksum.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.14.0"
lychee = "0.24.2"
rumdl = "0.2.79"
shellcheck = "0.11.0"
shfmt = "3.14.1"
zizmor = "1.30.1"

# Every task runs through sh, with errexit as in mise's default on
# Unix, since on Windows mise would run it with cmd, which cannot start
# a POSIX script. sh must be on PATH there, as it is in Git Bash, which
# the Windows CI job uses.
[task_config]
shell = "sh -o errexit -c"

# Entry point (ADR 4): every gate.

[tasks.check]
description = "Every gate"
depends = ["commits", "terms", "lint", "format:check", "docs:check", "test"]

# Gates (ADR 4): one task per gate, with its subtasks.
# lint, format:check and test run every task that matches their
# pattern, hidden ones too, so a task named like lint:x joins lint, and
# through it check; the pre-commit task lists its checks by hand.

[tasks.commits]
description = "Commit message gate (ADR 6); mise run commits -- --help lists its modes"
run = "scripts/check-commits"

[tasks."docs:check"]
description = "Check the links in the Markdown, YAML and text files"
run = "lychee --no-progress ."

[tasks."format:check"]
description = "Every format check"
depends = ["format:check:*"]

[tasks."format:check:go"]
description = "Fail with the diff the Go formatters would apply"
run = "scripts/check-go format"

[tasks."format:check:markdown"]
description = "Fail if rumdl would reformat a Markdown file"
run = "rumdl fmt --check ."

[tasks."format:check:shell"]
description = "Fail with the diff shfmt would apply"
run = "scripts/check-shell format"

[tasks.lint]
description = "Every linter"
depends = ["lint:*"]

# actionlint gets the workflow files by name: with none, it looks for a
# .git directory, which the pre-commit task's checkout lacks. The glob
# takes both .yml and .yaml.
[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
run = ["actionlint .github/workflows/*.y*ml", "zizmor --offline --pedantic --strict-collection ."]

[tasks."lint:adr"]
description = "Check the ADRs: numbering, the index, and length"
run = "scripts/check-adr"

[tasks."lint:go"]
description = "go vet, golangci-lint and go mod tidy -diff on the CLI"
run = "scripts/check-go lint"

[tasks."lint:markdown"]
description = "Lint the Markdown files"
run = "rumdl check ."

[tasks."lint:shell"]
description = "shellcheck, and the rules for each kind of shell file"
run = "scripts/check-shell lint"

[tasks.terms]
description = "Term check (ADR 3); mise run terms -- --help lists its modes"
run = "scripts/check-terms"

[tasks.test]
description = "Every test suite; test:bats takes bats options after --"
depends = ["test:*"]

[tasks."test:bats"]
description = "bats suites under test/; options after -- go to bats"
run = "bats test"
run_windows = "echo test:bats: skipped, bats has no Windows build"

[tasks."test:go"]
description = "Go tests of the CLI, with -race where the platform and cgo allow"
run = "scripts/check-go test"

# The harness probes run the claude and codex on PATH, whose newest
# releases change without any change here, so check leaves them out,
# and .github/workflows/probes.yml runs them on a schedule, without
# blocking a merge (ADR 9 item 4).
[tasks.probes]
description = "Harness probes on the installed claude and codex; mise run probes -- --help lists its options"
run = "scripts/run-probes"

# govulncheck asks the Go vulnerability database, so it needs the
# network, and a new report can fail a branch that has not changed. So
# check leaves it out, and .github/workflows/vuln.yml runs it instead,
# without blocking a merge (ADR 16 item 3).
[tasks.vuln]
description = "Known vulnerabilities in the CLI and the Go it is built with"
run = "scripts/check-go vuln"

# Fixers: they rewrite files, so check does not run them. format:fix
# runs every task that matches format:fix:*.

[tasks."format:fix"]
description = "Every formatter, rewriting the files"
depends = ["format:fix:*"]

[tasks."format:fix:go"]
description = "Let the Go formatters rewrite the CLI's code"
run = "scripts/check-go fix"

[tasks."format:fix:markdown"]
description = "Let rumdl rewrite the Markdown files"
run = "rumdl fmt ."

[tasks."format:fix:shell"]
description = "Let shfmt rewrite the shell code"
run = "scripts/check-shell fix"

# Hooks (ADR 4): scripts/hooks/ runs these tasks.

[tasks.commit-msg]
description = "commit-msg hook: the term check and the commit message gate on a message"
usage = 'arg "<file>" help="The commit message file"'
run = [
  'scripts/check-terms --message "${usage_file?}"',
  'scripts/check-commits --message "${usage_file?}"',
]

# The pre-commit task checks what is staged: scripts/staged-tree
# runs each lint and format check in a checkout of the index. It
# skips the link and vulnerability checks, which need the network, and
# the tests.
[tasks.pre-commit]
description = "pre-commit hook: the term check, lint and format check on the staged tree"
run = [
  "scripts/check-terms --staged",
  "scripts/staged-tree scripts/check-adr",
  "scripts/staged-tree scripts/check-shell lint",
  "scripts/staged-tree scripts/check-shell format",
  "scripts/staged-tree scripts/check-go lint",
  "scripts/staged-tree scripts/check-go format",
  "scripts/staged-tree sh -c 'actionlint .github/workflows/*.y*ml'",
  "scripts/staged-tree zizmor --offline --pedantic --strict-collection .",
  "scripts/staged-tree rumdl check .",
  "scripts/staged-tree rumdl fmt --check .",
]
