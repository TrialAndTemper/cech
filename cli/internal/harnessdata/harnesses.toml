[claude-code-eval-offline-grading]
harness = "claude-code"
kind = "gap"
summary = "claude plugin eval grades only the runs it makes, with a model; it cannot grade a recorded run, and has no grader that runs the author's code."
workaround = """
cech eval --check grades each case's recorded runs itself, with the \
regex and file_exists graders of CECH's own case format, so the eval \
gate runs no agent."""
decision = "ADR 25 item 4"
probe = """
Run claude plugin eval --help and read the plugin eval docs, looking \
for a way to grade a saved transcript without starting a run, and for \
graders that run code."""
expect = "Neither exists: context.history_file resumes a transcript as the start of a new run, and the docs say there are no custom-code graders."
verified = { version = "2.1.312", date = 2026-10-29 }

