[claude-code-eval-project-instructions]
harness = "claude-code"
kind = "gap"
summary = "claude plugin eval runs on Claude Code only, and loads no CLAUDE.md or AGENTS.md from the workspace it runs in, so it cannot test a skill reached through a project's routing rows, nor run on Codex."
workaround = """
cech eval drives both harnesses itself, starting each run in a copy of \
the eval folder's project/, with the routing rows added for a routed \
run; the eval gate checks those folders without running an agent."""
decision = "ADR 25 item 6"
probe = """
Copy the plugin folder plugins/writing/cech-example of \
cli/internal/app/testdata/eval/complete to the same path in an empty \
folder, and there write a case in claude plugin eval's format, \
evals/writing/cech-example/probe/: a script scaffold.sh that writes \
an AGENTS.md and a CLAUDE.md, each holding the line Marker: \
PROBE-7351, into the workspace; a case.yaml with name probe, \
context.scaffold_script scaffold.sh and one regex grader, no-marker, \
with pattern PROBE-7351 and match not_contains; and a prompt.md \
with plugins: ["../../../../plugins/writing/cech-example"] in its \
frontmatter, \
asking the model to repeat every line of its project instructions \
that holds the word Marker, or say NONE. Run \
claude plugin eval . --case probe --runs 1 \
--ablation none --model haiku --scaffold --keep-temp --trust-plugin \
--no-publish --json result.json, and read the kept trace; then run \
claude plugin eval --help."""
expect = "The trace does not hold PROBE-7351, and the help names no option to run another harness."
verified = { version = "2.1.330", date = 2026-11-23 }

[[claude-code-eval-project-instructions.sources]]
