# The acme marketplace, an invented extension used as a test fixture.
namespace = "acme"
description = "Acme's agent skills, built on CECH"
cech = "0.1.0"
team = "@acme/skill-maintainers"

[owner]
name = "Acme skill maintainers"
email = "skills@acme.example"

[[categories]]
name = "brand"
holds = "Brand voice and visual identity"

[[roles]]
name = "acme-tracker"
means = "The tracker where Acme files and moves issues"

[[roles]]
name = "acme-brand-voice"
means = "A voice that Acme's writing follows"
many = true

[terms]
rules = ["checks/terms/rules.toml"]
names = ["checks/terms/names.txt"]
