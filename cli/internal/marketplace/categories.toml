# CECH's categories, the closed list of ADR 12 item 1, which the cech CLI
# builds in. Adding one is a reviewed change here; removing or merging one
# is a breaking change of the CLI (docs/reference/marketplace.md).

[[categories]]
name = "practice"
holds = "Tool-neutral engineering rules (testing, coding, config, logging, dependencies, containers, infrastructure as code)"

[[categories]]
name = "writing"
holds = "Prose, docs, decision records, changelogs, commit messages"

[[categories]]
name = "agent"
holds = "How agents work in a repository (instruction files, task records, estimates, change specs)"

[[categories]]
name = "workflow"
holds = "Multi-step flows that move a change through stages"

[[categories]]
name = "lang"
holds = "Programming and query languages and their runtimes, such as Go, SQL dialects or the JVM"

[[categories]]
name = "framework"
holds = "Libraries and frameworks"

[[categories]]
name = "tool"
holds = "One product each that a project installs or runs, such as a command-line tool, a database or a message broker"

[[categories]]
name = "platform"
holds = "Hosted services: forges, trackers, clouds, observability"

[[categories]]
name = "meta"
holds = "Authoring and testing CECH skills"
