# The gates of ADR 5, run with the tools pinned in mise.toml. CI runs
# the two tasks that `mise run check` runs for a contributor: commits
# once, on Linux, since commit messages are the same on every system, and
# check:os, every other gate, on each system. So there is no second list
# of gates to keep in step, and a new gate needs no change here (ADR 5
# item 2); only the private term tier has its own job.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue tests each pull request on the latest main before it
  # merges.
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main
# gets its own group, since GitHub replaces a pending run in a group and
# the replaced push would go unchecked.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Install only the versions and checksums in mise.lock.
  MISE_LOCKED: "1"

jobs:
  # The commit gate, in its own job, so that fixup commits left
  # for review fail this job alone and leave the checks of each system
  # green. Its first three steps copy the check job's, which explains
  # them; keep the copies in step.
  commits:
    name: commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.3

      - name: range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT}" = pull_request ] || [ "${EVENT}" = merge_group ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif git cat-file -e "${BEFORE}^{commit}" 2> /dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            echo "::warning::old tip of main unknown; checking every commit"
            range=${GITHUB_SHA}
          fi
          echo "CECH_RANGE=${range}" >> "${GITHUB_ENV}"

      - name: commits
        run: mise run --output prefix commits

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        # bash on every runner; on Windows that is Git Bash, which also
        # gives the tasks their sh.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The term gate, and the commit gate in the commits job, read
          # every commit in CECH_RANGE.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.3

      # The commits under check: the pull request's own, the merge
      # queue's, or the push's.
      # A push whose old tip is unknown, as on the first push or after a
      # force push, checks every commit on main. The term gate, and the
      # commit gate in the commits job, read CECH_RANGE when no mode is
      # given.
      - name: range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT}" = pull_request ] || [ "${EVENT}" = merge_group ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif git cat-file -e "${BEFORE}^{commit}" 2> /dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            echo "::warning::old tip of main unknown; checking every commit"
            range=${GITHUB_SHA}
          fi
          echo "CECH_RANGE=${range}" >> "${GITHUB_ENV}"

      # Each gate in check:os keeps running after another fails, so one run
      # reports every failing gate, each line prefixed with its task.
      # The token is for lychee, in docs:check, and for lint:codeowners.
      # lychee sends it only to GitHub, which rate-limits calls with a
      # token less than anonymous calls from shared runners.
      # lint:codeowners asks GitHub's API with it; scripts/check-codeowners
      # says why it needs no secret. Every gate sees it, but the job's
      # read-only permission lets it only read the repository, and it
      # expires with the job.
      - name: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run --continue-on-error --output prefix check:os

  # In CI, scripts/approval-diff runs only in the alpine image of
  # .github/workflows/approval.yml, under BusyBox, so its suite runs
  # there too, with git and bats from that Alpine release, not the
  # bats pinned in mise.toml (ADR 6 item 5). It is not a gate task, so
  # mise run check leaves it out. Keep the image in step with that
  # file.
  approval-alpine:
    name: approval suite (alpine)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: approval suite
        env:
          IMAGE: docker.io/library/alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf # 3.24
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src:ro" "${IMAGE}" \
            sh -c 'apk add --no-cache -q git bash bats > /dev/null && cp -R /src /tmp/src && cd /tmp/src && bats test/approval.bats'

  # The private term tier (ADR 4), in its own job so that no other job
  # sees the secret. The secret lives in the private-terms environment,
  # which holds each run until a maintainer approves it: a pull request's
  # run uses that pull request's copy of this file, so approve only after
  # reading its changes to .github/. Fork pull requests never receive the
  # secret and skip the job. So does the merge queue, where a skipped job
  # counts as passed: the pull request ran the job already, and the push
  # to main runs it again. Its first three steps copy the check job's,
  # which explains them; keep the copies in step.
  private-terms:
    name: private terms
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: private-terms
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.3

      - name: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT}" = pull_request ] || [ "${EVENT}" = merge_group ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif git cat-file -e "${BEFORE}^{commit}" 2> /dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            echo "::warning::old tip of main unknown; checking every commit"
            range=${GITHUB_SHA}
          fi
          echo "CECH_RANGE=${range}" >> "${GITHUB_ENV}"

      # Runs the term gate again, now with the private tier; a public
      # finding shows here and in the check jobs.
      - name: private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "${PRIVATE_TERMS}" ]; then
            echo "::error::the PRIVATE_TERMS secret is empty or not set"
            exit 2
          fi
          CECH_PRIVATE_TERMS="${RUNNER_TEMP}/private-terms.txt"
          printf '%s\n' "${PRIVATE_TERMS}" > "${CECH_PRIVATE_TERMS}"
          export CECH_PRIVATE_TERMS CECH_REQUIRE_PRIVATE_TERMS=1
          unset PRIVATE_TERMS
          mise run terms
